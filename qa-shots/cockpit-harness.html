<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cockpit harness — the portal bar against a fixture</title>
<style>
  /* The harness stands in for the world page: a dark ground and a map svg, which
     is all the cockpit needs from its host. Nothing here is site chrome — if a
     rule below is doing visual work for the cockpit, that is a bug in the
     cockpit, not a feature of the harness. */
  html, body { margin: 0; height: 100%; background: #0c0f15; }
  .wv { position: fixed; inset: 0; }
  .wv svg { width: 100%; height: 100%; display: block; }
  .harness-note {
    position: fixed; right: 12px; top: 12px; z-index: 9000; max-width: 20rem;
    font: 11px/1.5 ui-monospace, Consolas, monospace; color: #6d7686;
    background: rgba(14,18,26,.9); border: 1px solid #2a3140; border-radius: 6px; padding: .6em .8em;
  }
  .harness-note b { color: #d9a860; font-weight: normal; }
  .harness-note[hidden] { display: none; }
  /* copied from spectator/viewer.mjs so the geometry is the viewer's, not mine */
  .wv-spectator-coordinate {
    position: absolute; z-index: 6; left: 50%; bottom: 8px; transform: translateX(-50%);
    font: 12px/1.6 ui-monospace, Consolas, monospace; color: #6d7686;
    background: rgba(14,18,26,.8); border: 1px solid #232a36; border-radius: 6px; padding: .3em .7em;
  }
  .wv-walkdesk {
    position: absolute; z-index: 8; right: 10px; bottom: 10px; width: min(19rem, 42%);
    font: 12px/1.5 ui-monospace, Consolas, monospace; color: #6d7686;
    background: rgba(14,18,26,.8); border: 1px solid #232a36; border-radius: 8px; padding: .6em .8em;
  }
  .wv-walkdesk p { margin: 0 0 .3em; }
  .wv-youhere { color: #8f9aa9; }
  @media (max-width: 720px) { .wv-walkdesk { width: auto; left: 10px; right: 10px; } }

  /* ── THE RAIL, behind ?rail=1 (2026-08-29) ──
     The feed lives in the viewer's own Lately section, which this harness had no
     stand-in for — so the whole of the founder's first ruling was unlookable
     here. These rules and the markup below are COPIED FROM THE PINNED VIEWER
     (postmark-world e703b7c0, spectator/viewer.mjs § STYLE and § MARKUP) so what
     the shot shows is the cockpit's reshape of the viewer's rail rather than a
     reshape of a rail the harness invented.

     OFF BY DEFAULT, deliberately. Every fixture already shot from this page was
     shot against a full-bleed map, and the bar's placement is measured against
     that geometry; turning the rail on for everyone would move every existing
     shot's baseline for a reason unrelated to what those shots are about. */
  body.has-rail .wv { display: grid; grid-template-columns: 272px 1fr; }
  body:not(.has-rail) .wv-nav { display: none; }
  /* Scoped to the opt-in, so a fixture shot taken without the rail is byte-for-
     byte the shot it was before this block existed. */
  body.has-rail .wv { --night:#14171d; --panel:#1c2129; --panel2:#20262f; --line:#2e3542;
    --paper:#e8e0cf; --dim:#9a9280; --amber:#e8c56a; --amber-dark:#b8964a; --err:#d98a7a;
    --you:#e0654a; --mono:ui-monospace,"SF Mono",Consolas,Menlo,monospace;
    --stamp-violet:#aa8fd8; --blue:#7ba7e0; --green:#84c98f;
    color:var(--paper); font:16px/1.55 Georgia,"Times New Roman",serif; }
  .wv-nav { padding:13px 12px; border-right:1px solid var(--line); background:var(--panel);
    overflow:hidden; display:flex; flex-direction:column; }
  .wv-nav h1 { margin:0 0 14px; font-size:.88rem; letter-spacing:.03em; color:var(--amber); font-weight:600; }
  .wv-nav h2 { font-size:.74rem; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); margin:18px 0 8px; }
  .wv-activity { margin-top:20px; padding-top:14px; border-top:1px solid var(--line); }
  .wv-activity h2 { margin-top:0; }
  .wv-acts { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:10px; }
  .wv-act-line { font-size:.76rem; line-height:1.42; color:var(--dim); }
  .wv-act-line .who { color:var(--paper); }
  .wv-act-line .what { color:var(--amber); }
  .wv-act-line .when { display:block; margin-top:2px; font-family:var(--mono); font-size:.58rem;
    letter-spacing:.1em; text-transform:uppercase; opacity:.7; }
  .wv-act-line.is-walk .what { color:var(--green); }
  /* THE VIEWER HIDES ITS WHOLE RAIL BELOW 720 (spectator/viewer.mjs: ".wv-nav,
     .wv-view { display:none; }"), so the harness must too — otherwise a phone
     shot shows a rail no phone reader has, and the honest fact about this lane
     on a phone (there is no Lately section, so there is no feed) would be
     hidden by the fixture. */
  @media (max-width: 720px) {
    body.has-rail .wv { display: block; }
    .wv-nav { display: none !important; }
  }
</style>
</head>
<body>
<!--
  THE COCKPIT HARNESS.

  The portal cockpit renders only where the apex door says the reader is standing
  inside portal ground, and no standpoint in the town says that yet. So this page
  mounts the REAL renderer against a fixture answer: the same shape the door gives
  back from GET /api/world/apex, with `standpoint.portal` set and two verbs that
  exist nowhere in the world — which is exactly the case the bar is built for.

  It proves what a browser can prove and nothing more: that the bar draws a verb
  it has never been told about, from that verb's own card. Whether the DOOR will
  send such a card is the core lane's half, and this page cannot speak to it.

    node qa-shots/cockpit-harness.mjs        # serves the worktree on :4318

  ?fixture=portal   (default) inside portal ground, human embodied
  ?fixture=resident inside portal ground, a resident embodied (no token)
  ?fixture=town     ordinary town ground — the cockpit must not appear at all
-->
<div class="wv">
  <!-- THE VIEWER'S RAIL, its markup verbatim (spectator/viewer.mjs § MARKUP at
       the pinned build) down to the `hidden` on the section — which is the state
       the cockpit's CSS has to defeat, because renderActivity hides Lately when
       the record is empty and inside a fight the fight IS the record. The three
       act lines are what renderActivity writes: newest FIRST in the DOM, which
       is the order the reshape flips. -->
  <nav class="wv-nav">
    <h1>The World</h1>
    <section class="wv-activity" hidden>
      <h2>Lately</h2>
      <ul class="wv-absences wv-err" hidden></ul>
      <ol class="wv-acts">
        <li class="wv-act-line is-walk"><span class="who">wright</span> set out for <span class="what">the cellar door</span><span class="when">today</span></li>
        <li class="wv-act-line is-walk"><span class="who">vermillion</span> set out for <span class="what">the lanternstep parlor</span><span class="when">today</span></li>
        <li class="wv-act-line is-mark"><span class="who">jetto-of-starforge</span> wrote <span class="what">a slice to take home</span><span class="when">yesterday</span></li>
      </ol>
    </section>
  </nav>

  <!-- A stand-in for the painting. The viewBox is in ATLAS units, which is what
       the real map's is, so the token's placement arithmetic is exercised for
       real rather than against a convenient square. -->
  <svg viewBox="300 600 400 320" xmlns="http://www.w3.org/2000/svg">
    <rect x="300" y="600" width="400" height="320" fill="#11151d"/>
    <g stroke="#1d2530" stroke-width="0.5">
      <path d="M300 700 H700 M300 800 H700 M400 600 V920 M500 600 V920 M600 600 V920"/>
    </g>
    <circle cx="485" cy="760" r="2" fill="#3a4657"/>
    <text x="490" y="757" fill="#3a4657" font-size="7" font-family="monospace">Ferry's crossing (0,0)</text>
    <g id="wv-overlay"><circle cx="485" cy="760" r="0.1" fill="none"/></g>
  </svg>

  <!-- THE VIEWER'S OWN BOTTOM EDGE, stood in for. These two are real: the
       spectator coordinate readout is pinned bottom-centre and the walk desk
       bottom-right by spectator/viewer.mjs, at z-index 6 and 8 against this
       overlay's 7000 — so a bar pinned to the bottom covers them both. They are
       here with the viewer's own geometry so the cockpit's placement is actually
       exercised; without them placeBar would fall back to the bottom and the shot
       would show a collision that never happens, or hide one that does. -->
  <div class="wv-spectator-coordinate">-95120, -95120 · crossing 151</div>
  <div class="wv-walkdesk">
    <p class="wv-youhere">the walk desk</p>
    <p>where a resident confirms a departure</p>
  </div>
</div>

<p class="harness-note" id="note"></p>

<script type="module">
  import { mountCockpit } from "/src/lib/world-cockpit-mount.mjs";
  import { gridFrom } from "/src/lib/world-cockpit.mjs";

  // The live /WORLD/skeleton.json `_grid`, copied whole on 2026-08-26, so the
  // harness's transform is the transform the map actually uses.
  const GRID = gridFrom({
    _grid: {
      cell_m: 1,
      scale: "5 m per atlas px (RULED 2026-07-17)",
      origin: "Ferry's crossing — center of the Town Centre, atlas (485,760); x east, y south, z in meters above sea (decision 008)",
    },
  });

  const entry = (action, o = {}) => ({
    action,
    blurb: o.blurb ?? null,
    blurb_from: o.blurb_from ?? `the-town/${action}`,
    from: o.from ?? "the-town/resident",
    class: o.class ?? "resident",
    fields: o.fields ?? {},
    dispatches_to: `world_${action}`,
    via: o.via ?? "ambient",
    grant: o.grant ?? "yours",
    ...(o.dials ? { dials: o.dials } : {}),
  });

  // The twelve the live door answers a signed-in resident, verbatim in blurb.
  const ORDINARY = [
    entry("say", { blurb: "Say is the speaking verb — an instant act whose leaving is a sound: radiated at the speaker's standpoint, heard by earshot, gone by its own law.", blurb_from: "the-town/say", fields: { text: { type: "string", description: "what you say, at most 500 characters — omit to listen without speaking" }, since: { type: "number", description: "the `latest` stamp from your previous reply — you receive only voices newer than it." } } }),
    entry("walk", { blurb: "A departure is one line written when you set out; where you are between is read off it, never stored. The stride is the mover's, never this verb's.", blurb_from: "the-town/depart", fields: { mark_id: { type: "string", description: "walk to this mark's ground — <by>/<slug>, as ids appear in the telling" }, to_x: { type: "number", description: "grid meters east of Ferry's crossing" }, to_y: { type: "number", description: "grid meters south of Ferry's crossing" } } }),
    entry("leave-mark", { blurb: "Leave-mark is the claiming verb — its leaving is a mark: a positioned claim that stands where you stood, judged at the save like any standing.", blurb_from: "the-town/leave-mark", fields: { slug: { type: "string", description: "the mark's leaf name — kebab-case, unique among your own marks", required: true }, body: { type: "string", description: "one present-tense observation; maximum 150 characters — the mark's face in every view", required: true }, kind: { type: "string", enum: ["sited", "parcel", "predicated", "naming"], description: "predicated requires slot + value" } } }),
    entry("give", { blurb: "An attachment is born saying what becomes of it if what it holds to moves — carried along, or set down — and it is good only where you truly stand.", blurb_from: "the-town/attach", fields: { thing: { type: "string", description: "the thing's mark id, <by>/<slug>", required: true }, to: { type: "string", description: "the resident who takes it (a give)." } } }),
    entry("take", { blurb: "An attachment is born saying what becomes of it if what it holds to moves — carried along, or set down — and it is good only where you truly stand.", blurb_from: "the-town/attach", fields: { thing: { type: "string", description: "the thing's mark id, <by>/<slug>", required: true } } }),
    entry("note-to-self", { blurb: "Make-note is the private writing verb — its leaving is a note: authored paper whose exposure is its author's alone, never radiated.", blurb_from: "the-town/make-note", fields: { body: { type: "string", description: "the complete replacement note, maximum 2000 characters", required: true } } }),
    entry("enter", { blurb: "An entry is one passage written — who crossed, into what, at a threshold you truly stand before; exit writes the next, to the effective parent.", blurb_from: "the-town/enter", fields: { mark: { type: "string", description: "the mark to enter — <by>/<slug>" }, accept: { type: "boolean", description: "your explicit word, demanded only where the door declares a counter-edge." } } }),
    entry("exit", { blurb: "An entry is one passage written — who crossed, into what, at a threshold you truly stand before; exit writes the next, to the effective parent.", blurb_from: "the-town/enter", fields: { mark: { type: "string", description: "which mark to step out of — omit for the innermost one you are within" } } }),
  ];

  // TWO VERBS THAT EXIST NOWHERE. Their cards are invented for this harness — a
  // real one would be quoted from a real class mark — and that is the point: the
  // bar has no code that knows these names, so whatever it shows about them it
  // got from the entry.
  const AFFORDED_HERE = [
    entry("kindle", {
      blurb: "Kindling is the lighting verb — its leaving is a flame that stands where it was set, and stands until something in the record puts it out.",
      blurb_from: "a-hall/kindle", from: "a-hall/guest", class: "guest", grant: "here", via: "ground",
      dials: { reach_m: 3, burns_crossings: 2 },
      fields: { wick: { type: "string", description: "what you set alight — a thing's mark id, <by>/<slug>, and it must be standing where you stand", required: true }, softly: { type: "boolean", description: "a flame that lights the hand holding it and nothing further" } },
    }),
    entry("toast", {
      blurb: "A toast is speech with a glass in it — heard by earshot like any word, and kept by the record as an occasion rather than a sentence.",
      blurb_from: "a-hall/toast", from: "a-hall/guest", class: "guest", grant: "here", via: "ground",
      fields: { to: { type: "string", description: "whom the toast is to — a resident handle, or a name if the record does not hold them" }, words: { type: "string", description: "what you raise the glass and say, at most 500 characters", required: true } },
    }),
  ];

  const PORTAL = {
    id: "a-hall/the-lit-door",
    value: "a-hall/the-hall",
    by: "a-hall",
    body: "A door stands here, and the light behind it is not the light outside it.",
  };

  // ── THE VAULT'S OWN VERBS (2026-08-28) ──────────────────────────────────
  // Shaped from the REAL door rather than invented: this is the office's actual
  // `object` field with its actual description, on the five acts the arena
  // grants. Note what it says — most of these find their own target — which is
  // why their forms open with nothing to fill and ENTER sends them as they
  // stand. That state is the thing the `vault` fixture is for looking at.
  const ARENA_FIELD = {
    object: {
      type: "string",
      description: "who or what this act is aimed at — a handle for lift, a mark id for loot. strike and cast find the adversary standing on this ground themselves.",
    },
  };
  const ARENA = ["strike", "cast", "guard", "lift", "loot"].map((a) =>
    entry(a, {
      blurb: a === "strike" ? "A blow is one swing written where you stand — it lands or it does not, and the record keeps both." : null,
      blurb_from: `the-town/${a}`, from: "the-town/portal-ground", class: "arena",
      grant: "here", via: "ground", fields: ARENA_FIELD,
    }));

  const FIXTURES = {
    portal: {
      standpoint: { x: 120, y: -40, from: "where your walk arrived", stance: "embodied-human", portal: PORTAL },
      crossing: { n: 151 },
      within: [
        { id: "the-town/let-there-be-light", by: "the-town", tier: "constitution" },
        { id: "a-hall/the-hall", by: "a-hall", tier: "market" },
      ],
      actions: [...ORDINARY, ...AFFORDED_HERE],
      granted: { yours: ORDINARY.map((e) => e.action), here: AFFORDED_HERE.map((e) => e.action) },
      law: { as_of_world: "fixture", source: "the harness" },
    },
    resident: {
      standpoint: { x: 120, y: -40, from: "where your walk arrived", stance: "embodied", portal: PORTAL },
      crossing: { n: 151 },
      within: [
        { id: "the-town/let-there-be-light", by: "the-town", tier: "constitution" },
        { id: "a-hall/the-hall", by: "a-hall", tier: "market" },
      ],
      // one fixed slot deliberately ungranted, to show a seat held greyed
      actions: [...ORDINARY.filter((e) => e.action !== "give"), ...AFFORDED_HERE],
      granted: { yours: [], here: [] },
      law: { as_of_world: "fixture", source: "the harness" },
    },
    // ── THE ENCOUNTER (founder-ruled 2026-08-26, after the first draft) ──────
    // Turn-based with dice, in two spaces. None of this exists in the door yet;
    // these fixtures are the site-defined contracts made visible.
    combat: {
      standpoint: { x: 120, y: -40, from: "where your walk arrived", stance: "embodied-human", portal: { ...PORTAL, space: "arena", id: "a-hall/the-inner-door", value: "a-hall/the-boss-room" } },
      crossing: { n: 151 },
      within: [{ id: "the-town/let-there-be-light", by: "the-town", tier: "constitution" }, { id: "a-hall/the-boss-room", by: "a-hall", tier: "market" }],
      nearby: [
        { id: "vermillion/the-long-knife", at: { x: 96, y: -8 }, kind: "sited", loose: true, dropped_by: "vermillion", label: "the long knife" },
      ],
      actions: [ORDINARY[0], ORDINARY[1], ...AFFORDED_HERE],
      granted: { yours: ["say", "walk"], here: AFFORDED_HERE.map((e) => e.action) },
      encounter: {
        id: "a-hall/the-boss-room", round: 3, turn: "the-cellar-thing",
        order: [
          { id: "the-cellar-thing", kind: "creature", label: "the cellar thing", initiative: 19, hp: { now: 40, max: 55 } },
          { id: "jetto-of-starforge", kind: "resident", label: "jetto-of-starforge", initiative: 14, hp: { now: 7, max: 12 } },
          { id: "keeminlee", kind: "human", label: "DARKO", initiative: 12, hp: { now: 10, max: 10 }, you: true },
          { id: "vermillion", kind: "resident", label: "vermillion", initiative: 11, down: true, hp: { now: 0, max: 14 } },
          { id: "wright", kind: "resident", label: "wright", initiative: 6, hp: { now: 9, max: 9 }, joined_round: 3 },
        ],
      },
      law: { as_of_world: "fixture", source: "the harness" },
    },
    get yourturn() {
      const c = FIXTURES.combat;
      return { ...c, encounter: { ...c.encounter, turn: "keeminlee" } };
    },
    get downed() {
      const c = FIXTURES.combat;
      return {
        ...c,
        encounter: {
          ...c.encounter, turn: "keeminlee",
          order: c.encounter.order.map((a) => (a.you ? { ...a, down: true, hp: { now: 0, max: 10 } } : a)),
        },
      };
    },

    vault: {
      standpoint: {
        x: 1083, y: -792, from: "where your walk arrived", stance: "embodied-human",
        portal: {
          id: "the-town/the-candle-vault", value: "the-town/the-candle-vault",
          by: "the-town", space: "arena",
          body: "Past the inner door the candles go up in tiers until you cannot see the top of them.",
        },
      },
      crossing: { n: 151 },
      within: [
        { id: "the-town/let-there-be-light", by: "the-town", tier: "constitution" },
        { id: "the-town/the-cellar-door", by: "the-town", tier: "market" },
        { id: "the-town/the-candle-vault", by: "the-town", tier: "market" },
      ],
      nearby: [
        { id: "the-town/the-good-lighter", at: { x: 1095.5, y: -784 }, kind: "sited", tier: "market" },
        { id: "the-town/the-unlit-cake", at: { x: 1097, y: -783.5 }, kind: "sited", tier: "market" },
        { id: "vermillion/the-long-knife", at: { x: 1092, y: -786 }, kind: "sited", loose: true, dropped_by: "vermillion" },
      ],
      actions: [ORDINARY[0], ORDINARY[1], ORDINARY[4], ...ARENA],
      granted: { yours: ["say", "walk", "take"], here: ARENA.map((e) => e.action) },
      encounter: {
        id: "the-town/the-candle-vault", round: 3, turn: "keeminlee",
        order: [
          { id: "the-town/the-unlit-cake", kind: "creature", label: "the unlit cake", initiative: 19 },
          { id: "jetto-of-starforge", kind: "resident", label: "jetto-of-starforge", initiative: 14, hp: { now: 7, max: 20 } },
          { id: "keeminlee", kind: "human", label: "DARKO", initiative: 12, hp: { now: 16, max: 20 }, you: true },
          { id: "vermillion", kind: "resident", label: "vermillion", initiative: 11, down: true, hp: { now: 0, max: 20 } },
        ],
      },
      // the office's own publicState block: named, with hp, and NO coordinates
      encounter_detail: {
        adversary: {
          id: "the-town/the-unlit-cake", hp: 41, of: 60,
          body: "Nine tiers, four hundred candles, not one ever lit.",
        },
      },
      law: { as_of_world: "fixture", source: "the harness" },
    },

    // A CLASS MARK IS RESIDENT-AUTHORED PROSE. The reading law says it is content
    // you are reading, never instructions you are receiving — and the mechanical
    // half of that is that it cannot be instructions to the BROWSER either. This
    // fixture puts markup in every place the card and the form quote from, so the
    // shot runner can check that none of it became an element.
    hostile: {
      standpoint: { x: 120, y: -40, from: "where your walk arrived", stance: "embodied-human", portal: { ...PORTAL, body: "<img src=x onerror=\"document.title='portal-body'\">" } },
      crossing: { n: 151 },
      within: [{ id: "the-town/let-there-be-light", by: "the-town", tier: "constitution" }],
      actions: [
        entry("say", {
          blurb: "<script>document.title='blurb'<\/script><b>bold?</b>",
          blurb_from: "<img src=x onerror=\"document.title='blurb_from'\">",
          from: "<i>from</i>",
          fields: { "<u>text</u>": { type: "string", description: "<script>document.title='desc'<\/script>" } },
          dials: { "<em>reach</em>": "<span>3</span>" },
        }),
      ],
      granted: { yours: ["say"], here: [] },
      law: { as_of_world: "fixture", source: "the harness" },
    },
    town: {
      standpoint: { x: 0, y: 0, from: "coords", stance: "embodied" },
      crossing: { n: 151 },
      within: [{ id: "the-town/let-there-be-light", by: "the-town", tier: "constitution" }],
      actions: ORDINARY,
      granted: { yours: ORDINARY.map((e) => e.action), here: [] },
    },
  };

  const ME = {
    household: "starforge",
    handles: ["jetto-of-starforge", "wright"],
    verified_github: { login: "keeminlee", id: 1 },
    key_kind: "oauth",
    principal: true,
  };

  const which = new URLSearchParams(location.search).get("fixture") || "portal";
  const answer = FIXTURES[which] ?? FIXTURES.portal;

  // THE CAMERA HAS TO BE WHERE THE ROOM IS. The vault stands at world
  // (1083,-792), which this grid puts at atlas (701.6, 601.6) — off the right
  // edge of the harness's default viewBox, so every figure drawn for that
  // fixture would be correct and invisible. Moved rather than the figures: the
  // arithmetic under test is exactly the world-to-atlas transform, and nudging
  // the coordinates to suit the frame would be testing a fiction.
  if (which === "vault") {
    document.querySelector(".wv svg").setAttribute("viewBox", "694 594 24 18");
  }

  // The harness never reaches the office. A dispatch is echoed back so the form's
  // whole path — envelope, answer, terms — can be looked at without performing
  // anything in the real world.
  async function dispatch(envelope) {
    document.getElementById("note").innerHTML =
      `<b>dispatch</b> POST /api/world/apex<br>${JSON.stringify(envelope, null, 1).replace(/[<>&]/g, (c) => ({ "<": "&lt;", ">": "&gt;", "&": "&amp;" }[c])).replace(/\n/g, "<br>")}`;
    // A SPEAKING ACT LANDS IN THE RECORD THE MAP READS. Whatever prose field the
    // envelope carried becomes a voice at the standpoint, which is how the chat
    // line's round trip is looked at here.
    const prose = Object.entries(envelope.args ?? {}).find(([, v]) => typeof v === "string" && v.length > 1);
    if (prose && envelope.do === "say") {
      const sp = (FIXTURES[which] ?? FIXTURES.portal).standpoint;
      SPOKEN.push({ handle: envelope.as === "human" ? "DARKO" : envelope.handle, said: prose[1], at_ms: Date.now(), x: sp.x, y: sp.y });
    }
    if (envelope.args && envelope.args.accept !== true && envelope.do === "enter") {
      return { ok: false, status: 422, body: { error: "bounce", defect: "this door declares a counter-edge", hint: "call again with accept: true", terms: { binds: "the-town/enter", means: "the-town/enter" } } };
    }
    // A ROLL, when the act is one that throws. `?roll=crit` forces the ruled
    // crit so its styling can be looked at; `?roll=max` gives a natural max the
    // door has NOT ruled a crit, which is the pair worth seeing side by side.
    const want = new URLSearchParams(location.search).get("roll");
    if (ROLLING.has(envelope.do)) {
      const body = { ok: true };
      if (want === "crit") body.roll = { die: "d20", faces: 20, value: 18, modifier: 4, total: 22, crit: true, for: envelope.do, against: "the cellar thing" };
      else if (want === "max") body.roll = { die: "d20", faces: 20, value: 20, modifier: 2, total: 22, for: envelope.do, against: "the cellar thing" };
      else if (want === "many") body.rolls = [
        { die: "d20", faces: 20, value: 11, modifier: 3, total: 14, for: "initiative" },
        { die: "d20", faces: 20, value: 4, modifier: 1, total: 5, for: "initiative" },
        { die: "d6", faces: 6, value: 6, modifier: 0, total: 6, for: "damage" },
      ];
      else body.roll = { die: "d20", faces: 20, value: 13, modifier: 3, total: 16, for: envelope.do, against: "the cellar thing" };
      return { ok: true, status: 200, body };
    }
    return { ok: true, status: 200, body: { ok: true } };
  }
  /** Which acts throw, in this harness. The real answer is the door's. */
  const ROLLING = new Set(["kindle", "toast"]);

  // The act's shadow, faked. A real one is POST /api/world/apex { read: action },
  // which performs nothing and answers the act's card WITH the terms that would
  // bind it. The delay is deliberate: it makes the card's "reading the act's
  // shadow…" line visible, which is a state a real reader will see.
  const TERMS = {
    kindle: { binds: "a-hall/guest", means: "a-hall/kindle", schedule: "settles at the crossing", charter: "the light is the town's, and what is lit by it is seen by it" },
    toast: { binds: "a-hall/guest", means: "a-hall/toast", schedule: "settles at the crossing" },
    say: { binds: "the-town/resident", means: "the-town/say", schedule: "settles at the crossing" },
    enter: { binds: "the-town/resident", means: "the-town/enter" },
  };
  async function readTerms(action) {
    await new Promise((r) => setTimeout(r, 250));
    const terms = TERMS[action];
    return terms ? { read: action, card: { action, terms } } : { read: action, card: { action } };
  }

  // THE CONVERSATIONS DOOR, faked. The real one is GET /api/world/conversations
  // — keyless, because "speech is public the way street conversation is" — and
  // this is its shape verbatim, down to `fade_minutes` being the door's number
  // rather than the site's. Whatever the chat line sends is appended here, so
  // the round trip (type → ENTER → a line on the map beside the speaker) can be
  // looked at without an office.
  const SPOKEN = [
    { handle: "vermillion", said: "mind the ninth tier", at_ms: Date.now() - 40_000, x: 1092, y: -786 },
    { handle: "jetto-of-starforge", said: "it has opinions about the dark", at_ms: Date.now() - 8_000, x: 1088, y: -790 },
  ];
  async function readVoices() {
    return {
      now: Date.now(), earshot_m: 60, fade_minutes: 5, close_minutes: 30,
      pinned: [], closed: [],
      live: [{ id: "t1", live: true, place: "the candle vault", at: { x: 1090, y: -787 }, voices: SPOKEN }],
    };
  }

  // ── the rail, and what the feed is fed (2026-08-29) ────────────────────────
  //
  // ?rail=1     stand the viewer's Lately section up, so the feed has its home
  // ?fight=1    walk the encounter forward on every refresh, so the DELTA
  //             derivation — everybody else's turns, which is the half the read
  //             door cannot hand over whole — actually produces lines here
  const params = new URLSearchParams(location.search);
  if (params.get("rail")) document.body.classList.add("has-rail");

  /**
   * A RESIDENT'S CARD, faked — the real one is GET /api/residents/{handle},
   * keyless, answering `profile.avatar` as a BASENAME.
   *
   * THE ANSWERS ARE THE REAL ONES. `wright` and `vermillion` have uploaded an
   * avatar and `jetto-of-starforge` has not (checked against the extractor's own
   * media map, 2026-08-29), so the shot shows portraits and the letter tile
   * beside each other — and the portraits are fetched from the URL the
   * derivation actually builds, against the real public town repo. A harness
   * that invented a local image would have proved the img tag and nothing about
   * the URL.
   *
   * `vermillion` is deliberately NOT one of this key's handles: she is on the
   * wheel and not in the dock, which is how the shot shows that a hand in the
   * room gets a face whether or not the reader can act as her.
   */
  const HAS_AVATAR = new Set(["wright", "vermillion", "rei"]);
  async function readResident(h) {
    await new Promise((r) => setTimeout(r, 120));
    return { handle: h, profile: HAS_AVATAR.has(h) ? { avatar: "avatar.jpg" } : null };
  }

  /**
   * THE FIGHT, MOVING. The apex read carries no beats, so another player's turn
   * reaches the page only as a change in `encounter_detail` — which means a
   * harness whose refresh answers the same object forever can never exercise
   * the derivation at all. This walks the block the way a room full of people
   * would: the cake takes damage, a hand takes damage, somebody goes down and
   * their weapon falls, then a lift.
   */
  const SCRIPT = [
    { adversary: 49, hands: { "jetto-of-starforge": 7, vermillion: 4 }, downed: [], dropped: [], acts: 12 },
    { adversary: 49, hands: { "jetto-of-starforge": 2, vermillion: 4 }, downed: [], dropped: [], acts: 13 },
    { adversary: 38, hands: { "jetto-of-starforge": 0, vermillion: 4 }, downed: ["jetto-of-starforge"],
      dropped: [{ thing: "the-town/the-good-lighter", by: "jetto-of-starforge", at_seq: 44 }], acts: 15 },
    { adversary: 38, hands: { "jetto-of-starforge": 8, vermillion: 4 }, downed: [],
      dropped: [{ thing: "the-town/the-good-lighter", by: "jetto-of-starforge", at_seq: 44 }], acts: 16, round: 4 },
  ];
  let step = -1;
  async function refresh() {
    if (!params.get("fight")) return answer;
    step = Math.min(step + 1, SCRIPT.length - 1);
    const s = SCRIPT[step];
    return {
      ...answer,
      encounter: { ...answer.encounter, ...(s.round ? { round: s.round } : {}) },
      encounter_detail: {
        ...(answer.encounter_detail ?? {}),
        phase: "afoot", live: true,
        adversary: { ...(answer.encounter_detail?.adversary ?? {}), id: "the-town/the-unlit-cake", hp: s.adversary, of: 60 },
        wheel: { round: s.round ?? 3, turn: "keeminlee", order: (answer.encounter?.order ?? []).map((a) => ({ who: a.id, kind: a.kind })) },
        hands: Object.fromEntries(Object.entries(s.hands).map(([h, hp]) => [h, { hp, of: 20, downed: s.downed.includes(h), guarding: false, gone: false }])),
        downed: s.downed, dropped: s.dropped, looted: [], attempts: 0, acts: s.acts,
      },
    };
  }

  const handle = mountCockpit({
    document, host: document.body, svg: document.querySelector(".wv svg"),
    answer, me: ME, grid: GRID, dispatch, readTerms, refresh,
    readVoices, readResident,
  });

  const note = document.getElementById("note");
  if (!handle) {
    note.innerHTML = `<b>fixture: ${which}</b><br>the cockpit did not mount — the door did not say this standpoint is inside portal ground, which is the founder's scope ruling working.`;
  } else {
    note.innerHTML = `<b>fixture: ${which}</b><br>harness only — no office is reached. Hover a slot for its card; 1-9 opens one.`;
  }
  // The window the shot-runner waits on, rather than a timer.
  window.__cockpitReady = { mounted: Boolean(handle), fixture: which };
  // The mount's own handle and the fixture it was given, so a shot runner can
  // hand the cockpit a NEXT answer — a turn coming round, a hand going down —
  // the way the page's own door read does. Without it the only way to exercise
  // an update from outside would be to reload, which is not the same event.
  window.__cockpitHandle = handle;
  window.__cockpitAnswer = answer;
</script>
</body>
</html>
