# test.yml — the falsifiers get a pulse (born 2026-08-25, POS-55 review's flag:
# "a falsifier nobody runs cannot fail" — this repo had no test CI at all).
# Non-required by design: it reports, it does not yet gate. Making it a
# required check is a repo-settings act and the founder's call, once this has
# run green for a while on real traffic.
name: test
on:
  push:
    branches: ["main", "train/**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # THE TOWN CHECKOUT (2026-09-04). test/extract-seam.test.mjs runs its
      # funding-seam controls against a live Town and SKIPS without one — so this
      # job stayed green for nine days (08-26 → 09-04) while the same suite was red
      # on every box that had a Town, and the Worldkeeper withdrew S56's site pin
      # on it. The Town is public; a shallow clone into the path the test already
      # looks at (".postmark-checkout", sync-atlas.yml's own name) makes the 600
      # controls run here on every push.
      - name: Check the Town out beside the site (the funding seam's other half)
        run: git clone --depth 1 https://github.com/postmark-town/postmark.git .postmark-checkout
      - run: npm test
