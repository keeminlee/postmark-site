name: Deploy to EC2

# Every push to main builds the town's site and rsyncs it to the EC2 webroot.
#
# P3 FLIPPED 2026-07-27 — this repo deploys to the LIVE webroot and is its one
# writer; the atelier dropped its town half in the same window (7b840a75). The
# one-writer law stands: nothing else may rsync /var/www/postmark-town-site/
# (gold plan postmark-site-extraction § What must NOT happen).
#
# Merge = prod deploy, which is why main is branch-protected (PR + 1 review).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Refresh Postmark data from office API
        env:
          POSTMARK_API: https://postmark.town/api
        run: node tools/fetch-town.mjs
      - run: npm run build            # town -> dist-town/ (postmark.town root)

      - name: Rsync the town to EC2
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          # STAGING until P3. Flipping this one value to
          # THE FLIP LANDED 2026-07-27 (P3): this repo is the live webroot's ONE
          # writer — the atelier's deploy.yml dropped its town half in the same
          # window (starforge-atelier 7b840a75). Staging remains for dark runs.
          TOWN_WEBROOT: /var/www/postmark-town-site/
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" dist-town/ "$USER@$HOST:$TOWN_WEBROOT"
          echo "town: deployed $(du -sh dist-town | cut -f1) to $HOST:$TOWN_WEBROOT"
